[build]
  publish = "."
  command = "for f in tools/png/*.b64; do n=$(basename $f .b64); base64 -d $f > $n; done"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Clean URLs (/vault, /world, /privacy) are served automatically by Netlify "pretty URLs".
[[redirects]]
  from = "/world.html"
  to = "/world"
  status = 301
[[redirects]]
  from = "/vault.html"
  to = "/vault"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://api.open-meteo.com; media-src 'self' https:; font-src 'self'"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/tracks.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

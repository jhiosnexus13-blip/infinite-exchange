<!DOCTYPE html>

<style>
:root{
  --bg:#050607; --panel:#0a0e0d; --line:#1c2b26; --signal:#00ff9d;
  --text:#d4ded9; --dim:#5c6b66; --alarm:#ff2e4d; --radius:3px;
  --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
}
@font-face{ font-family:'JetBrains Mono'; src: local('JetBrains Mono'); }
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  background:var(--bg); color:var(--text); font-family:var(--mono);
  line-height:1.55; overflow-x:hidden; position:relative;
}
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:500;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.12) 3px);
  mix-blend-mode:overlay; opacity:.35;
}
a{ color:var(--signal); }
::selection{ background:var(--signal); color:#000; }
.wrap{ max-width:1040px; margin:0 auto; padding:0 clamp(1.25rem,3vw,2.5rem); }
button{ font-family:inherit; }

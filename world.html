<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JHIOS // 3D TERMINAL WORLD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050607;
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
    color: #00ff9d;
  }
  #canvas { display: block; width: 100vw; height: 100vh; }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.13) 3px);
    pointer-events: none; z-index: 10; opacity: 0.4;
  }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  #blocker {
    position: absolute; inset: 0;
    background: rgba(5,6,7,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: auto; z-index: 50;
  }
  #blocker.hidden { display: none; }
  #blocker h1 {
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    letter-spacing: 0.12em;
    margin-bottom: 0.7rem;
    text-shadow: 0 0 18px rgba(0,255,157,0.45);
  }
  #blocker p {
    font-size: 0.78rem; color: #5c6b66;
    text-align: center; max-width: 310px;
    line-height: 1.5; margin-bottom: 1.6rem;
  }
  .btn {
    padding: 0.8rem 1.8rem;
    border: 1px solid #00ff9d;
    background: transparent;
    color: #00ff9d;
    font-family: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn:hover, .btn:active {
    background: #00ff9d; color: #001a10;
  }

  #hud {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 0.55rem 1rem;
    background: rgba(5,6,7,0.92);
    border-top: 1px solid #1c2b26;
    font-size: 0.62rem; color: #5c6b66;
    display: flex; justify-content: space-between;
  }
  #hud .live { color: #00ff9d; }

  .signal-panel {
    width: 280px;
    background: rgba(8,12,11,0.94);
    border: 1px solid #1c2b26;
    padding: 0.7rem;
    font-size: 0.7rem;
    color: #d4ded9;
    pointer-events: auto;
    transform: scale(0.85);
    opacity: 0;
    transition: opacity 0.35s, transform 0.35s;
  }
  .signal-panel.visible {
    opacity: 1;
    transform: scale(1);
  }
  .signal-panel h3 {
    color: #00ff9d;
    font-size: 0.78rem;
    margin-bottom: 0.35rem;
    letter-spacing: 0.04em;
  }
  .signal-panel p {
    font-size: 0.68rem;
    line-height: 1.4;
    margin-bottom: 0.55rem;
    color: #a8b5b0;
  }
  .signal-panel iframe {
    width: 100%;
    height: 148px;
    border: 1px solid #1c2b26;
    background: #000;
  }
  .signal-panel a {
    display: inline-block;
    margin-top: 0.4rem;
    color: #00ff9d;
    font-size: 0.65rem;
    text-decoration: none;
  }

  #touch-left, #touch-right {
    position: absolute; top: 0; bottom: 55px; width: 50%; z-index: 15; display: none;
  }
  #touch-left { left: 0; } #touch-right { right: 0; }
  @media (pointer: coarse) {
    #touch-left, #touch-right { display: block; }
  }
</style>
</head>
<body>

<div id="blocker">
  <h1>JHIOS // WORLD</h1>
  <p>
    First-person terminal space with floating players.<br>
    Desktop: click → WASD + mouse<br>
    Mobile: left side move · right side look
  </p>
  <button class="btn" id="start-btn">ENTER THE CURRENT</button>
</div>

<div id="ui">
  <div id="hud">
    <span>JHIOS_KERNEL // 3D_LAYER</span>
    <span class="live">● LIVE</span>
    <span id="pos">0 0 0</span>
  </div>
</div>

<div id="touch-left"></div>
<div id="touch-right"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050607);
scene.fog = new THREE.FogExp2(0x050607, 0.016);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 1.7, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
renderer.domElement.id = 'canvas';

const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

scene.add(new THREE.AmbientLight(0x00ff9d, 0.14));
const dir = new THREE.DirectionalLight(0x00ff9d, 0.35);
dir.position.set(6, 14, 8);
scene.add(dir);

const grid = new THREE.GridHelper(90, 90, 0x00ff9d, 0x0a2f22);
grid.material.opacity = 0.22;
grid.material.transparent = true;
scene.add(grid);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 90),
  new THREE.MeshStandardMaterial({ color: 0x0a0e0d, roughness: 0.92 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

function createMonolith(x, z, height = 4.2) {
  const group = new THREE.Group();
  const geo = new THREE.BoxGeometry(1.3, height, 1.3);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x0a0e0d,
    emissive: 0x00ff9d,
    emissiveIntensity: 0.09,
    roughness: 0.7
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = height / 2;
  group.add(mesh);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x00ff9d, transparent: true, opacity: 0.55 })
  );
  edges.position.y = height / 2;
  group.add(edges);

  group.position.set(x, 0, z);
  scene.add(group);
  return group;
}

const signals = [
  {
    x: -7, z: -5,
    label: 'Million Masks of God',
    text: 'The one looking out of your eyes is the same one looking out of mine. We are the million masks of God.',
    yt: 't27zLXvXljs'
  },
  {
    x: 8, z: -6,
    label: 'Cross & Lace',
    text: 'Nights like this. Highest frequency. The light, the lace, the cross.',
    yt: 'jQaSqYwx14Y'
  },
  {
    x: -6, z: 7,
    label: 'Collective Singularity',
    text: 'There is only one current. It freezes into temporary forms so it can be seen, then melts again so it can move.',
    yt: null
  },
  {
    x: 7, z: 6,
    label: 'Infinite Exchange',
    text: 'No middlemen. No algorithm deciding what reaches you. Just the continuous activity.',
    yt: null
  }
];

const monoliths = [];
const panels = [];

signals.forEach((s) => {
  const mono = createMonolith(s.x, s.z, 3.8 + Math.random() * 1.4);
  mono.userData = s;
  monoliths.push(mono);

  const div = document.createElement('div');
  div.className = 'signal-panel';
  div.innerHTML = `
    <h3>${s.label}</h3>
    <p>${s.text}</p>
    \( {s.yt ? `<iframe src="https://www.youtube.com/embed/ \){s.yt}?rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>` : ''}
    <a href="${s.yt ? 'https://www.youtube.com/watch?v=' + s.yt : 'https://infiniteexchange.online'}" target="_blank">
      → ${s.yt ? 'Open on YouTube' : 'Return to Archive'}
    </a>
  `;
  const label = new THREE.CSS2DObject(div);
  label.position.set(s.x, 3.2, s.z);
  scene.add(label);
  panels.push({ label, div, mono });
});

const pCount = 320;
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount * 3; i += 3) {
  pPos[i] = (Math.random() - 0.5) * 70;
  pPos[i+1] = Math.random() * 14 + 0.4;
  pPos[i+2] = (Math.random() - 0.5) * 70;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color: 0x00ff9d, size: 0.07, transparent: true, opacity: 0.55
}));
scene.add(particles);

// Controls
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();
let isLocked = false;
const controls = { pitch: 0, yaw: 0 };

const blocker = document.getElementById('blocker');
const startBtn = document.getElementById('start-btn');

function enterWorld() {
  initAudio();
  blocker.classList.add('hidden');
  isLocked = true;

  // Only request pointer lock on desktop
  if (!window.matchMedia('(pointer: coarse)').matches) {
    const canvas = document.getElementById('canvas');
    canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock || canvas.webkitRequestPointerLock;
    if (canvas.requestPointerLock) {
      canvas.requestPointerLock();
    }
  }
}

startBtn.addEventListener('click', function(e) {
  e.preventDefault();
  enterWorld();
});

startBtn.addEventListener('touchend', function(e) {
  e.preventDefault();
  enterWorld();
});

document.addEventListener('pointerlockchange', function() {
  if (!window.matchMedia('(pointer: coarse)').matches) {
    isLocked = !!document.pointerLockElement;
    blocker.classList.toggle('hidden', isLocked);
  }
});

document.addEventListener('mousemove', function(e) {
  if (!isLocked) return;
  controls.yaw -= e.movementX * 0.002;
  controls.pitch -= e.movementY * 0.002;
  controls.pitch = Math.max(-1.4, Math.min(1.4, controls.pitch));
});

document.addEventListener('keydown', function(e) {
  if (e.code === 'KeyW') moveForward = true;
  if (e.code === 'KeyS') moveBackward = true;
  if (e.code === 'KeyA') moveLeft = true;
  if (e.code === 'KeyD') moveRight = true;
});
document.addEventListener('keyup', function(e) {
  if (e.code === 'KeyW') moveForward = false;
  if (e.code === 'KeyS') moveBackward = false;
  if (e.code === 'KeyA') moveLeft = false;
  if (e.code === 'KeyD') moveRight = false;
});

// Mobile touch
let touchMoving = false, touchLooking = false;
let touchStart = {x:0, y:0}, lookStart = {x:0, y:0};

document.getElementById('touch-left').addEventListener('touchstart', function(e) {
  e.preventDefault();
  touchMoving = true;
  touchStart.x = e.touches[0].clientX;
  touchStart.y = e.touches[0].clientY;
}, {passive: false});

document.getElementById('touch-left').addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!touchMoving) return;
  const dx = e.touches[0].clientX - touchStart.x;
  const dy = e.touches[0].clientY - touchStart.y;
  moveForward = dy < -18;
  moveBackward = dy > 18;
  moveLeft = dx < -18;
  moveRight = dx > 18;
}, {passive: false});

document.getElementById('touch-left').addEventListener('touchend', function() {
  touchMoving = false;
  moveForward = moveBackward = moveLeft = moveRight = false;
});

document.getElementById('touch-right').addEventListener('touchstart', function(e) {
  e.preventDefault();
  touchLooking = true;
  lookStart.x = e.touches[0].clientX;
  lookStart.y = e.touches[0].clientY;
}, {passive: false});

document.getElementById('touch-right').addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!touchLooking) return;
  const dx = e.touches[0].clientX - lookStart.x;
  const dy = e.touches[0].clientY - lookStart.y;
  controls.yaw -= dx * 0.005;
  controls.pitch -= dy * 0.005;
  controls.pitch = Math.max(-1.4, Math.min(1.4, controls.pitch));
  lookStart.x = e.touches[0].clientX;
  lookStart.y = e.touches[0].clientY;
}, {passive: false});

document.getElementById('touch-right').addEventListener('touchend', function() {
  touchLooking = false;
});

// Audio
let audioCtx, masterGain, footstepTimer = 0;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.11;
  masterGain.connect(audioCtx.destination);

  const drone = audioCtx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 51;
  const dg = audioCtx.createGain();
  dg.gain.value = 0.28;
  const df = audioCtx.createBiquadFilter();
  df.type = 'lowpass';
  df.frequency.value = 155;
  drone.connect(df);
  df.connect(dg);
  dg.connect(masterGain);
  drone.start();

  const bufferSize = audioCtx.sampleRate * 2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.011;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  noise.loop = true;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 680;
  nf.Q.value = 0.55;
  const ng = audioCtx.createGain();
  ng.gain.value = 0.38;
  noise.connect(nf);
  nf.connect(ng);
  ng.connect(masterGain);
  noise.start();
}

function playFootstep() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = 'triangle';
  osc.frequency.value = 78 + Math.random() * 35;
  filter.type = 'lowpass';
  filter.frequency.value = 170;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.18);
}

// Animate
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  camera.rotation.order = 'YXZ';
  camera.rotation.y = controls.yaw;
  camera.rotation.x = controls.pitch;

  velocity.x -= velocity.x * 8.0 * delta;
  velocity.z -= velocity.z * 8.0 * delta;
  direction.z = Number(moveForward) - Number(moveBackward);
  direction.x = Number(moveRight) - Number(moveLeft);
  direction.normalize();
  if (moveForward || moveBackward) velocity.z -= direction.z * 26.0 * delta;
  if (moveLeft || moveRight) velocity.x -= direction.x * 26.0 * delta;

  camera.position.x += (velocity.x * Math.cos(controls.yaw) + velocity.z * Math.sin(controls.yaw)) * delta;
  camera.position.z += (-velocity.x * Math.sin(controls.yaw) + velocity.z * Math.cos(controls.yaw)) * delta;
  camera.position.y = 1.7;

  camera.position.x = Math.max(-38, Math.min(38, camera.position.x));
  camera.position.z = Math.max(-38, Math.min(38, camera.position.z));

  // Footsteps
  const moving = moveForward || moveBackward || moveLeft || moveRight;
  if (moving) {
    footstepTimer -= delta;
    if (footstepTimer <= 0) {
      playFootstep();
      footstepTimer = 0.37;
    }
  } else {
    footstepTimer = 0;
  }

  // Show / hide floating panels
  panels.forEach(function(p) {
    const dist = camera.position.distanceTo(p.mono.position);
    if (dist < 6.5) {
      p.div.classList.add('visible');
    } else {
      p.div.classList.remove('visible');
    }
  });

  // Particles
  const pos = particles.geometry.attributes.position.array;
  for (let i = 1; i < pos.length; i += 3) {
    pos[i] += Math.sin(Date.now() * 0.001 + i) * 0.0025;
  }
  particles.geometry.attributes.position.needsUpdate = true;

  document.getElementById('pos').textContent =
    camera.position.x.toFixed(1) + ' ' + camera.position.y.toFixed(1) + ' ' + camera.position.z.toFixed(1);

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
